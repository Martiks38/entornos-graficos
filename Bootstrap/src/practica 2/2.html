<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>
  <div class="container my-3">
    <div class="row g-3">

      <div class="col-12">
        <div class="p-3" style="background-color: #9B72AA;">&nbsp;</div>
      </div>

      <div class="col-12 col-sm-3">
        <div class="p-3 h-100" style="background-color: #F8D7DA;">
          &nbsp;
        </div>
      </div>

      <div class="col-12 col-sm-9">
        <div class="row g-3">

          <div class="col-12">
            <div class="p-2" style="background-color: #6FCF97;">&nbsp;</div>
          </div>

          <div class="col-6 col-sm-4">
            <div class="p-3" style="background-color: #8E8D8A;">&nbsp;</div>
          </div>
          <div class="col-6 col-sm-4">
            <div class="p-3" style="background-color: #8E8D8A;">&nbsp;</div>
          </div>
          <div class="col-6 col-sm-4">
            <div class="p-3" style="background-color: #8E8D8A;">&nbsp;</div>
          </div>
          <div class="col-6 col-sm-4">
            <div class="p-3" style="background-color: #8E8D8A;">&nbsp;</div>
          </div>

          <!-- Dado que no aparecen las seis celdas en el diseño para sm. Decidí ocultarlas siguientes dos celdas. -->
          <div class="col-6 col-sm-4 d-none d-sm-block">
            <div class="p-3" style="background-color: #8E8D8A;">&nbsp;</div>
          </div>
          <div class="col-6 col-sm-4 d-none d-sm-block">
            <div class="p-3" style="background-color: #8E8D8A;">&nbsp;</div>
          </div>


          <div class="col-6 col-sm-4">
            <div class="p-3" style="background-color: #6C9BCF;">&nbsp;</div>
          </div>
          <div class="col-6 col-sm-8">
            <div class="p-3" style="background-color: #6C9BCF;">&nbsp;</div>
          </div>

        </div>
      </div>

    </div>
  </div>
</body>

</html>
